name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.13'
            os: ubuntu-latest
          - python-version: '3.15'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check generated files and links
        run: python3 scripts/manage.py check
      - name: Test public maintenance and packaging
        run: python3 -m unittest discover -s tests -v
